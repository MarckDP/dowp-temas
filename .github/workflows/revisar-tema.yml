# Revisa un tema del buzón y, si pasa, abre un pull request para aprobarlo a mano.
#
# El archivo viene de cualquiera. Por eso está separado en trabajos:
#   - descargar: tiene permiso de escritura para leer el borrador, y nunca abre el archivo.
#   - validar: abre el archivo con el código de main, sin secretos ni permisos de escritura.
#   - crear-pr: usa solo lo que dejó el validador.
#   - limpiar: borra el archivo del buzón, pase lo que pase, y deja el estado para la página.
name: Revisar tema

on:
  workflow_dispatch:
    inputs:
      archivo:
        description: "Nombre del archivo en el borrador buzon"
        required: true
      nick:
        description: "Nick de quien lo sube (opcional)"
        required: false
  repository_dispatch:
    types: [tema-subido]

permissions: {}

jobs:
  descargar:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      asset_id: ${{ steps.buscar.outputs.asset_id }}
      release_id: ${{ steps.buscar.outputs.release_id }}
    steps:
      - name: Buscar el archivo en el buzón
        id: buscar
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ARCHIVO: ${{ github.event.inputs.archivo || github.event.client_payload.archivo }}
        run: |
          if ! printf '%s' "$ARCHIVO" | grep -Eq '^[A-Za-z0-9._-]{1,100}$'; then
            echo "Nombre de archivo no válido"; exit 1
          fi
          gh api "repos/$REPO/releases" --paginate > releases.json
          ASSET=$(jq -c --arg n "$ARCHIVO" '[.[] | select(.tag_name == "buzon" and .draft) | .assets[] | select(.name == $n)][0]' releases.json)
          if [ -z "$ASSET" ] || [ "$ASSET" = "null" ]; then
            echo "No está en el buzón"; exit 1
          fi
          SIZE=$(printf '%s' "$ASSET" | jq -r .size)
          ID=$(printf '%s' "$ASSET" | jq -r .id)
          echo "asset_id=$ID" >> "$GITHUB_OUTPUT"
          echo "release_id=$(jq -r '[.[] | select(.tag_name == "buzon" and .draft)][0].id' releases.json)" >> "$GITHUB_OUTPUT"
          if [ "$SIZE" -gt 47185920 ]; then
            echo "Pasa de 45 MB"; exit 1
          fi
          mkdir entrada
          gh api -H "Accept: application/octet-stream" "repos/$REPO/releases/assets/$ID" > entrada/tema.bin
      - uses: actions/upload-artifact@v4
        with:
          name: entrada
          path: entrada/tema.bin
          retention-days: 1

  validar:
    needs: descargar
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --disable-pip-version-check "pillow==12.3.0"
      - uses: actions/download-artifact@v4
        with:
          name: entrada
          path: entrada
      - name: Validar
        env:
          NICK: ${{ github.event.inputs.nick || github.event.client_payload.nick }}
        run: python tools/validar_tema.py entrada/tema.bin salida "$NICK"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: salida
          path: salida
          retention-days: 1

  crear-pr:
    needs: validar
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: salida
          path: salida
      - name: Abrir el pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          ID=$(jq -r .id salida/info.json)
          if ! printf '%s' "$ID" | grep -Eq '^[a-z0-9-]{1,50}$'; then
            echo "Identificador no válido"; exit 1
          fi
          RAMA="tema/$ID"
          # El mismo archivo ya está publicado o en revisión: no hay nada que hacer.
          if [ -d "temas/$ID" ] || git ls-remote --exit-code --heads origin "$RAMA" > /dev/null; then
            echo "Ya está publicado o en revisión"; exit 0
          fi
          mkdir -p temas
          cp -r "salida/$ID" "temas/$ID"
          python3 tools/cuerpo_pr.py salida/info.json "$REPO" "$RAMA" > cuerpo.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$RAMA"
          git add "temas/$ID"
          git commit -m "Tema: $ID"
          git push origin "$RAMA"
          gh pr create --base main --head "$RAMA" --title "Tema: $ID" --body-file cuerpo.md

  limpiar:
    needs: [descargar, validar, crear-pr]
    if: always() && needs.descargar.outputs.asset_id != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: salida
          path: salida
      - name: Dejar el estado
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RELEASE_ID: ${{ needs.descargar.outputs.release_id }}
          ARCHIVO: ${{ github.event.inputs.archivo || github.event.client_payload.archivo }}
          PR_RESULT: ${{ needs.crear-pr.result }}
        run: |
          if ! printf '%s' "$ARCHIVO" | grep -Eq '^tema-[A-F0-9]{8}\.bin$'; then
            echo "Subida manual, sin código"; exit 0
          fi
          CODIGO=${ARCHIVO#tema-}; CODIGO=${CODIGO%.bin}
          if [ -f salida/rechazo.txt ]; then
            jq -n --rawfile m salida/rechazo.txt '{estado: "rechazado", motivo: $m}' > estado.json
          elif [ -f salida/info.json ] && [ "$PR_RESULT" = "success" ]; then
            jq '{estado: "revision", tema: .id}' salida/info.json > estado.json
          else
            echo '{"estado":"error"}' > estado.json
          fi
          curl -sS --fail -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/json" \
            --data-binary @estado.json \
            "https://uploads.github.com/repos/$REPO/releases/$RELEASE_ID/assets?name=estado-$CODIGO.json" > /dev/null
      - name: Borrar el archivo y los estados de hace más de 30 días
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ASSET_ID: ${{ needs.descargar.outputs.asset_id }}
          RELEASE_ID: ${{ needs.descargar.outputs.release_id }}
        run: |
          gh api -X DELETE "repos/$REPO/releases/assets/$ASSET_ID"
          LIMITE=$(date -u -d '30 days ago' +%Y-%m-%dT%H:%M:%SZ)
          gh api "repos/$REPO/releases/$RELEASE_ID/assets" --paginate \
            --jq ".[] | select((.name | startswith(\"estado-\")) and .created_at < \"$LIMITE\") | .id" |
            while read -r VIEJO; do gh api -X DELETE "repos/$REPO/releases/assets/$VIEJO"; done
